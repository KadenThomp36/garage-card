blueprint:
  name: "Garage: Auto-Close if Left Open"
  description: >-
    Close the garage door if it's been left open — either after a period of no
    occupancy or at a specific time (e.g., midnight safety close). Sends a mobile
    notification to one or more devices. Respects a "keep open" helper toggle.
    Includes a configurable timeout — if the door doesn't close in time, a warning
    notification is sent.

    Designed as a companion to the Garage Card
    (https://github.com/KadenThomp36/garage-card). The card shows your garage
    door state in real time — this blueprint ensures it doesn't stay open
    indefinitely. Use the same keep_open input_boolean the card toggles to
    override auto-close directly from your dashboard.
  domain: automation
  author: KadenThomp36
  source_url: https://github.com/KadenThomp36/garage-card/blob/main/blueprints/auto_close_left_open.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    garage_door:
      name: Garage Door
      description: The garage door cover entity to control.
      selector:
        entity:
          filter:
            - domain: cover
    occupancy_sensor:
      name: Occupancy Sensor (optional)
      description: >-
        A binary sensor for garage occupancy (e.g., person detection from a camera).
        The door closes after the inactivity timeout when this turns off.
        Leave empty to disable inactivity-based closing.
      default: []
      selector:
        entity:
          filter:
            - domain: binary_sensor
    inactivity_minutes:
      name: Inactivity Timeout
      description: >-
        Minutes of no occupancy before the door auto-closes.
        Only used if an occupancy sensor is configured.
      default: 15
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: minutes
    safety_close_time:
      name: Safety Close Time (optional)
      description: >-
        Time of day to force-close the door regardless of occupancy (e.g., midnight).
        Leave empty to disable.
      default: ""
      selector:
        time: {}
    close_timeout:
      name: Close Timeout
      description: >-
        How long to wait for the door to finish closing before giving up.
        If the door doesn't reach "closed" in this time, a warning is sent.
      default: 2
      selector:
        number:
          min: 1
          max: 10
          unit_of_measurement: minutes
    keep_open_helper:
      name: Keep Open Helper (optional)
      description: >-
        An input_boolean that prevents auto-close when turned on.
        Leave empty to disable this check.
      default: ""
      selector:
        entity:
          filter:
            - domain: input_boolean
    notify_devices:
      name: Notification Devices (optional)
      description: >-
        Mobile devices to notify when the door auto-closes. Select multiple
        devices if needed. Leave empty to disable notifications.
      default: []
      selector:
        device:
          filter:
            - integration: mobile_app
          multiple: true
    notification_title:
      name: Notification Title
      description: Title shown in the notification.
      default: "Garage Auto-Closed"
      selector:
        text: {}
    include_timestamp:
      name: Include Timestamp
      description: Append the current time to the notification message.
      default: true
      selector:
        boolean: {}

trigger_variables:
  safety_time: !input safety_close_time

triggers:
  # Occupancy cleared while the door is open
  - trigger: state
    entity_id: !input occupancy_sensor
    to: "off"
    not_from:
      - unavailable
      - unknown
    for:
      minutes: !input inactivity_minutes
    id: inactivity
  # Door opened while nobody was in the garage
  - trigger: state
    entity_id: !input garage_door
    to: open
    for:
      minutes: !input inactivity_minutes
    id: inactivity
  # Template trigger (not a time trigger) so an empty safety close time is valid
  - trigger: template
    value_template: >-
      {{ safety_time | string | length > 0
         and now().strftime('%H:%M') == (safety_time | string)[:5] }}
    id: safety_close

variables:
  door: !input garage_door
  occupancy: !input occupancy_sensor
  keep_open: !input keep_open_helper
  inactivity_minutes: !input inactivity_minutes

conditions:
  - condition: state
    entity_id: !input garage_door
    state: open
  - condition: template
    value_template: >-
      {{ trigger.id == 'safety_close'
         or (occupancy | length > 0
             and is_state(occupancy, 'off')
             and (now() - states[occupancy].last_changed).total_seconds() >= inactivity_minutes * 60 - 5
             and (not keep_open or is_state(keep_open, 'off'))) }}

actions:
  - variables:
      reason: >-
        {{ 'Garage door closed — scheduled safety close' if trigger.id == 'safety_close'
           else 'Garage door closed — no activity detected' }}
  - action: cover.close_cover
    target:
      entity_id: !input garage_door
  - wait_template: "{{ is_state(door, 'closed') }}"
    timeout:
      minutes: !input close_timeout
    continue_on_timeout: true
  - variables:
      devices: !input notify_devices
      title: !input notification_title
      show_time: !input include_timestamp
      door_closed: "{{ wait.completed }}"
      message: >-
        {% if door_closed %}{{ reason }}{% if show_time %} at {{ now().strftime('%-I:%M %p') }}{% endif %}{% else %}WARNING: Garage door failed to close — check manually{% endif %}
  - repeat:
      for_each: "{{ devices }}"
      sequence:
        - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
          data:
            title: "{{ title if door_closed else 'Garage Door Warning' }}"
            message: "{{ message }}"

mode: single
max_exceeded: silent
